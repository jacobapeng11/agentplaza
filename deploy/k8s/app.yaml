apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: agentplaza
spec:
  selector:
    app.kubernetes.io/name: agentplaza-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplaza-backend
  labels:
    app.kubernetes.io/part-of: agentplaza
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplaza-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplaza-backend
        app.kubernetes.io/part-of: agentplaza
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.example.com/agentplaza/backend:1.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: agentplaza-backend-env
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp
      volumes:
        - name: backend-tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplaza-frontend-config
  labels:
    app.kubernetes.io/part-of: agentplaza
data:
  config.js: |
    window.__APP_CONFIG__ = {
      VITE_FASTGPT_FRONTEND_BASE_URL: '',
      VITE_MCP_GATEWAY_BASE_URL: ''
    };
---
apiVersion: v1
kind: Service
metadata:
  name: agentplaza-frontend
  labels:
    app.kubernetes.io/part-of: agentplaza
spec:
  selector:
    app.kubernetes.io/name: agentplaza-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplaza-frontend
  labels:
    app.kubernetes.io/part-of: agentplaza
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplaza-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplaza-frontend
        app.kubernetes.io/part-of: agentplaza
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: registry.example.com/agentplaza/frontend:1.1.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: public-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: public-config
          configMap:
            name: agentplaza-frontend-config
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi
