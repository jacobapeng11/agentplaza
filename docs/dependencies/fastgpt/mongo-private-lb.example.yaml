apiVersion: v1
kind: Service
metadata:
  name: fastgpt-mongo-private
  namespace: fastgpt
spec:
  type: LoadBalancer
  # Replace with the cloud controller's approved internal class before applying.
  # For an annotation-based controller, set its private scheme and remove this class.
  loadBalancerClass: example.com/internal-tcp
  # Replace this documentation-only CIDR with approved private egress sources.
  loadBalancerSourceRanges:
    - 192.0.2.0/24
  allocateLoadBalancerNodePorts: false
  selector:
    statefulset.kubernetes.io/pod-name: fastgpt-mongo-0
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      targetPort: 27017
